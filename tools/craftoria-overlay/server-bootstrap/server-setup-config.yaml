_specver: 2

modpack:
  name: Craftoria
  description: The latest & best of NeoForge on 1.21

install:
  mcVersion:
  loaderVersion: 21.1.249
  modpackUrl: https://mediafilez.forgecdn.net/files/8850/18/Craftoria-1.36.0.zip
  installerUrl: "https://maven.neoforged.net/releases/net/neoforged/neoforge/{{@loaderversion@}}/neoforge-{{@loaderversion@}}-installer.jar"
  ignoreFiles:
    - mods/optifine*.jar
    - resources/**
  additionalFiles:
  localFiles: ~
  installerArguments:
    - "--installServer"
  modpackFormat: curse
  formatSpecific:
    ignoreProject:
      - 737481 # Chat Toggle
      - 363363 # Extreme Sound Muffler
      - 394468 # Embeddium/Sodium
      - 908741 # Legacy client-only exclusion retained for compatibility
      - 986380 # Lighty
      - 844662 # Entity Model Features
      - 568563 # Entity Texture Features
      - 915902 # Euphoria Patches
      - 690971 # SeasonHUD
      - 455508 # Iris
      - 1089803 # Better Modlist
      - 925889 # Sounds
      - 1112793 # Perception
      - 1133580 # Smithing Template Viewer
      - 1274497 # Particle Effects Reforged
      - 1254143 # Colorwheel
      - 1285475 # Colorwheel Patcher
      - 646146 # Raise Sound Limit Simplified
      - 1351246 # Iris/Oculus Shader Folder
      - 1326436 # Fancy Toasts
      - 1374153 # Punchy
      - 447673 # Sodium Extra
      - 574123 # Dark Mode Everywhere
      - 532127 # Legendary Tooltips
  baseInstallPath:
  checkFolder: true
  installLoader: true
  installPack: true
  spongeBootstrapper: ~
  connectTimeout: 90
  readTimeout: 90

launch:
  maxRam: 5G
  minRam: 3G
  autoRestart: false
  javaArgs:
    - "-XX:+UseG1GC"
  spongefix: false
  ramDisk: false
  checkOffline: false
  crashLimit: 10
  crashTimer: 60min
  preJavaArgs: ~
  forcedJavaPath: ~
  startCommand:
    - "@libraries/net/neoforged/neoforge/{{@loaderversion@}}/{{@os@}}_args.txt"
    - "nogui"
