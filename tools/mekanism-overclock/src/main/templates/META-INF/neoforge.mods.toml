modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Mekanism Overclock contributors"
description='''
Configurable post-eight-upgrade overclocking for Mekanism machines.
'''

[[mixins]]
config="mekanism_overclock.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
type="required"
versionRange="${mekanism_mod_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism_unleashed"
type="incompatible"
reason="Both mods replace Mekanism's upgrade limits and scaling calculations."
versionRange="[0,)"
ordering="NONE"
side="BOTH"
